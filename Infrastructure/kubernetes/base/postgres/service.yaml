apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: microsift
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: microsift
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: tcp-postgres
      port: 5432
      targetPort: 5432
      protocol: TCP