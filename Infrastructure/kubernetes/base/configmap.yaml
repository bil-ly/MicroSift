apiVersion: v1
kind: ConfigMap
metadata:
  name: microsift-config
  namespace: microsift
  labels:
    app.kubernetes.io/part-of: microsift
data:
  # Database settings (internal to cluster - same everywhere)
  POSTGRES_DB: "microsift"
  POSTGRES_USER: "microsift"

  # Keycloak internal settings (same everywhere)
  KC_DB: "postgres"
  KC_DB_URL: "jdbc:postgresql://postgres:5432/microsift"
  KC_PROXY_HEADERS: "xforwarded"
  KC_HTTP_ENABLED: "true"

  # Backend internal settings (same everywhere)
  KEYCLOAK_JWKS_URL: "http://keycloak:8080/realms/microsift/protocol/openid-connect/certs"
  KEYCLOAK_AUDIENCE: "microsift-api"