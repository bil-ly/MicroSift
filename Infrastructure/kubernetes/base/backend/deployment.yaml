apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: microsift
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: microsift
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: microsift
    spec:
      containers:
        - name: backend
          image: microsift-backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: KEYCLOAK_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: microsift-config
                  key: KEYCLOAK_ISSUER
            - name: KEYCLOAK_JWKS_URL
              valueFrom:
                configMapKeyRef:
                  name: microsift-config
                  key: KEYCLOAK_JWKS_URL
            - name: KEYCLOAK_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: microsift-config
                  key: KEYCLOAK_AUDIENCE
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10