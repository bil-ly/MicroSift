apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: microsift
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: microsift
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: microsift
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: keycloak
          image: microsift-keycloak
          imagePullPolicy: IfNotPresent
          args:
            - start
            - --optimized
            - --import-realm
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: microsift-secrets
                  key: KEYCLOAK_ADMIN_USERNAME
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: microsift-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_DB
              valueFrom:
                configMapKeyRef:
                  name: microsift-config
                  key: KC_DB
            - name: KC_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: microsift-config
                  key: KC_DB_URL
            - name: KC_DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: microsift-config
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: microsift-secrets
                  key: POSTGRES_PASSWORD
            - name: KC_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: microsift-config
                  key: KC_HOSTNAME
            - name: KC_PROXY_HEADERS
              valueFrom:
                configMapKeyRef:
                  name: microsift-config
                  key: KC_PROXY_HEADERS
            - name: KC_HTTP_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: microsift-config
                  key: KC_HTTP_ENABLED
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: microsift-config
                  key: FRONTEND_URL
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: microsift-config
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: microsift-config
                  key: SMTP_PORT
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-config