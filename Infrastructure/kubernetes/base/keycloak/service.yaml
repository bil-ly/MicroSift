apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: microsift
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: microsift
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: management
      port: 9000
      targetPort: 9000
      protocol: TCP