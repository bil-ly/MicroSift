apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: microsift

resources:
  - ../../base
  - mailpit/service.yaml
  - mailpit/deployment.yaml

secretGenerator:
  - name: microsift-secrets
    envs:
      - .env.secrets
    options:
      disableNameSuffixHash: true

images:
  - name: microsift-backend
    newName: localhost/microsift-backend2.0
    newTag: latest
  - name: microsift-frontend
    newName: localhost/microsift-frontend
    newTag: local
  - name: microsift-keycloak
    newName: localhost/microsift-keycloak
    newTag: local

patches:
  - target:
      kind: ConfigMap
      name: microsift-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: microsift-config
      data:
        KC_HOSTNAME: "http://auth.localhost:8089"
        KEYCLOAK_ISSUER: "http://auth.localhost:8089/realms/microsift"
        FRONTEND_URL: "http://app.localhost:8089"
        SMTP_HOST: "mailpit"
        SMTP_PORT: "1025"
  - target:
      kind: Ingress
      name: microsift-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: app.localhost
      - op: replace
        path: /spec/rules/1/host
        value: auth.localhost
