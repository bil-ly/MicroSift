apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: microsift
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: microsift
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
      protocol: TCP
    - name: http
      port: 8025
      targetPort: 8025
      nodePort: 30025
      protocol: TCP
