apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: microsift
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: microsift
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/part-of: microsift
    spec:
      containers:
        - name: mailpit
          image: docker.io/axllent/mailpit:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /livez
              port: 8025
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: 8025
            initialDelaySeconds: 10
            periodSeconds: 10
