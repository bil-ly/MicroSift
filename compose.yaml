services:
  postgres:
    image: postgres:16-alpine
    container_name: microsift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-microsift}
      POSTGRES_USER: ${POSTGRES_USER:-microsift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - microsift-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: microsift-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-microsift}
      KC_DB_USERNAME: ${POSTGRES_USER:-microsift}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    container_name: microsift-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  frontend:
    image: node:22-alpine
    container_name: microsift-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./Frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"

  backend:
    image: ghcr.io/astral-sh/uv:python3.14-trixie-slim
    container_name: microsift-backend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "uv sync && uv run --no-sync uvicorn backend.api:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      KEYCLOAK_ISSUER: http://localhost:8080/realms/microsift
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/microsift/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: microsift-api
    volumes:
      - ./Backend:/app
      - backend-venv:/app/.venv
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  microsift-postgres-data:
  frontend-node-modules:
  backend-venv:
