name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check ignored local and generated files
        run: |
          ignored_tracked_files=$(git ls-files -ci --exclude-standard)
          if [ -n "$ignored_tracked_files" ]; then
            echo "Tracked files must not match .gitignore:"
            echo "$ignored_tracked_files"
            exit 1
          fi
          git check-ignore -q --no-index .env
          git check-ignore -q --no-index .idea/workspace.xml
          git check-ignore -q --no-index Backend/.venv/
          git check-ignore -q --no-index Backend/dist/
          git check-ignore -q --no-index Frontend/node_modules/
          git check-ignore -q --no-index Frontend/dist/
          git check-ignore -q --no-index Infrastructure/terraform/.terraform/
          git check-ignore -q --no-index Infrastructure/terraform/terraform.tfstate

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          working-directory: Backend

      - name: Install Python
        run: uv python install 3.14

      - name: Install package
        run: uv sync --locked

      - name: Smoke test entry point
        run: uv run backend

      - name: Build package
        run: uv build

  compose:
    name: Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          KEYCLOAK_ADMIN_PASSWORD: ci-only-keycloak-password
        run: docker compose config --quiet
