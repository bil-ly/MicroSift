server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kubernetes health check endpoint
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # React SPA fallback: send all routes (/login, /dashboard) to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}