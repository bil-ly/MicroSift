version: '3'

tasks:
  up:
    desc: Start all local services and the local Kubernetes cluster
    cmds:
      - docker compose up -d
      - task: k8s:cluster:up

  down:
    desc: Stop all local services and destroy the local Kubernetes cluster
    cmds:
      - docker compose down
      - task: k8s:cluster:down

  status:
    desc: Show service and cluster status
    cmds:
      - docker compose ps
      - kubectl get nodes -o wide

  logs:
    desc: Follow all service logs
    cmds:
      - docker compose logs -f

  check:
    desc: Run backend and frontend checks inside containers
    cmds:
      - docker compose exec -T backend uv run python -m unittest discover -s tests
      - docker compose exec -T frontend npm run lint
      - docker compose exec -T frontend npm test -- --run
      - docker compose exec -T frontend npm run build

  k8s:cluster:up:
    desc: Create the local kind Kubernetes cluster via Terraform
    dir: Infrastructure/terraform/local
    cmds:
      - test -d .terraform || terraform init
      - systemd-run --scope --user -p "Delegate=yes" env KIND_EXPERIMENTAL_PROVIDER=podman terraform apply -auto-approve

  k8s:cluster:down:
    desc: Destroy the local kind Kubernetes cluster via Terraform
    dir: Infrastructure/terraform/local
    cmds:
      - env KIND_EXPERIMENTAL_PROVIDER=podman terraform destroy -auto-approve
      - rm -f microsift-config