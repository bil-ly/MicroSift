version: '3'

tasks:
  up:
    desc: Start all local services
    cmds:
      - docker compose up -d

  down:
    desc: Stop all local services without deleting data
    cmds:
      - docker compose down

  status:
    desc: Show service status
    cmds:
      - docker compose ps

  logs:
    desc: Follow all service logs
    cmds:
      - docker compose logs -f

  check:
    desc: Run backend and frontend checks inside containers
    cmds:
      - docker compose exec -T backend uv run python -m unittest discover -s tests
      - docker compose exec -T frontend npm run lint
      - docker compose exec -T frontend npm test -- --run
      - docker compose exec -T frontend npm run build
